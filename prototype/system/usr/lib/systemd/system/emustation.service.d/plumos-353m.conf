[Unit]
Description=plumOS mini PLUS frontend for Anbernic RG353M
ConditionPathExists=
RequiresMountsFor=/storage
StartLimitIntervalSec=60
StartLimitBurst=3

[Service]
ExecStartPre=
ExecStart=
ExecStart=/usr/lib/plumos-353m/start-frontend
ExecStopPost=/usr/bin/rm -f /tmp/plumos-fe-ready
KillMode=control-group
Restart=on-failure
RestartSec=3
